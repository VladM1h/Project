<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="setup-card">
    <div id="auth-section">
        <div id="api-key-wrapper">
            <input type="text" id="api-key-input" placeholder="Введите ваш X-Yandex-Weather-Key">
        </div>
        <button id="proxy-auth-btn" onclick="handleProxyClick()">Разблокировать CORS-прокси</button>
        <div id="reset-key-link" class="reset-link" onclick="resetApiKey()">Сбросить сохраненный API ключ</div>
        <button id="save-key-btn" onclick="saveKeyAndShow()" disabled style="background-color: #ccc; cursor: not-allowed;">Подтвердить ключ и прокси</button>
    </div>

    <div id="weather-actions" style="display: none;">
        <select id="city-select">
            <option value="54.6545,19.9093">Балтийск</option>
            <option value="54.6477,21.0651">Гвардейск</option>
            <option value="54.7732,20.6052">Гурьевск</option>
            <option value="54.9589,20.4761">Зеленоградск</option>
            <option value="54.7065,20.511">Калининград</option>
            <option value="55.0311,22.0264">Неман</option>
            <option value="54.9508,20.2275">Пионерск</option>
            <option value="54.9399,20.1548">Светлогорск</option>
            <option value="54.675,20.1347">Светлый</option>
            <option value="55.0839,21.8785">Советск</option>
            <option value="54.6334,21.8156">Черняховск</option>
        </select>
        <button onclick="fetchWeather()">Показать погоду</button>
    </div>
</div>

<div id="loading" class="loading">Загружаем данные...</div>

<div class="weather-card" id="weather-card">
    <h2 id="city-title">Погода</h2>
    <div id="weather-content"></div>
</div>
<script src="script.js"></script>
</body>
</html>
