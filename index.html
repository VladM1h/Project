<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="setup-card">
    <div id="auth-section">
        <div id="api-key-wrapper">
            <input type="text" id="api-key-input" placeholder="Введите ваш X-Yandex-Weather-Key">
        </div>
        <button id="proxy-auth-btn" onclick="window.open('https://cors-anywhere.herokuapp.com/corsdemo', '_blank')">Разблокировать CORS-прокси</button>
        <div id="reset-key-link" class="reset-link" onclick="resetApiKey()">Сбросить сохраненный API ключ</div>
        <button id="save-key-btn" onclick="saveKeyAndShow()">Подтвердить ключ и прокси</button>
    </div>

    <div id="weather-actions" style="display: none;">
        <select id="city-select">
            <option value="54.7104,20.4522">Калининград</option>
            <option value="54.9589,20.4761">Зеленоградск</option>
            <option value="54.9431,20.1558">Светлогорск</option>
            <option value="54.6430,19.8922">Балтийск</option>
            <option value="55.0805,21.8753">Советск</option>
            <option value="54.6360,21.8105">Черняховск</option>
        </select>
        <button onclick="fetchWeather()">Показать погоду</button>
    </div>
</div>

<div id="loading" class="loading">Загружаем данные...</div>

<div class="weather-card" id="weather-card">
    <h2 id="city-title">Погода</h2>
    <div id="weather-content"></div>
</div>
<script src="script.js"></script>
</body>
</html>
